name: Build and Release eBPF Monitor

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang llvm libbpf-dev
          sudo apt-get install -y linux-tools-$(uname -r) || sudo apt-get install -y linux-tools-common linux-tools-generic

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Build Binary
        run: |
          # 运行我们更新后的 Makefile
          # 它会处理 vmlinux.h -> generate -> build
          make build

      - name: Prepare Release Artifact
        run: |
          # 获取当前系统架构 (如 x86_64, aarch64)
          ARCH=$(uname -m)
          # 将二进制文件重命名，增加版本和架构标识
          # 例如: netmonitor -> netmonitor-v1.0.0-linux-x86_64
          mv netmonitor netmonitor-${{ github.ref_name }}-linux-${ARCH}
          
          # 可选：如果你想查看一下生成了哪些中间文件（调试用）
          echo "Generated BPF files:"
          ls bpf_*.go bpf_*.o || echo "No arch-specific BPF files found"

      - name: Create Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            netmonitor-${{ github.ref_name }}-linux-*
          draft: false
          prerelease: false
          generate_release_notes: true
